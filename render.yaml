# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: prewatch
    runtime: node
    plan: starter
    branch: claude/bold-carson-foqch2
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PREWATCH_SECRET
        generateValue: true
      - key: PREWATCH_DATA_DIR
        value: /var/data
      # First admin account. Fill these in when you create the service.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: enables "Write AI summary" (Claude).
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: prewatch-data
      mountPath: /var/data
      sizeGB: 1
